name: Publish All New Packages

on:
  workflow_dispatch:
    inputs:
      packages:
        description: "Packages to publish (comma-separated)"
        required: true
        default: "shader-library,runtime,feature-providers,ui"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          registry-url: "https://registry.npmjs.org/"

      - name: Install dependencies
        run: npm install --workspaces --include-workspace-root

      - name: Build all packages
        run: npm run build:packages

      - name: Publish packages
        run: |
          IFS=',' read -ra PACKAGES <<< "${{ github.event.inputs.packages }}"
          for pkg in "${PACKAGES[@]}"; do
            echo "Publishing @clypra/$pkg..."
            cd "packages/$pkg"
            npm publish --access public
            cd ../..
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
