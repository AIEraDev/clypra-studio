name: Publish @clypra/engine

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # semantic-release pushes release commits + tags
      issues: write # semantic-release opens failure issues
      pull-requests: write # semantic-release comments on PRs
      id-token: write # OIDC token for npm Trusted Publishing

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          # No registry-url here — setup-node with registry-url injects a .npmrc
          # that overrides NPM_TOKEN with NODE_AUTH_TOKEN, breaking semantic-release.
          # Let semantic-release manage npm auth directly via NPM_TOKEN env var.

      - name: Install monorepo dependencies
        run: npm install --workspaces --include-workspace-root

      - name: Build @clypra/engine
        run: npm run build:engine

      - name: Run semantic-release
        working-directory: packages/clypra-engine
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          GIT_AUTHOR_NAME: "github-actions[bot]"
          GIT_AUTHOR_EMAIL: "github-actions[bot]@users.noreply.github.com"
          GIT_COMMITTER_NAME: "github-actions[bot]"
          GIT_COMMITTER_EMAIL: "github-actions[bot]@users.noreply.github.com"
