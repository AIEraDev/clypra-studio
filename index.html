    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background-color: #0e0e12;
        color: #f4f4f5;
      }

      #app-loading {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(100% 120% at 50% 0%, rgba(124, 111, 255, 0.12) 0%, transparent 44%),
          linear-gradient(180deg, #111117 0%, #0e0e12 100%);
        z-index: 9999;
      }

      #app-loading .spinner {
        width: 48px;
        height: 48px;
        border: 3px solid #262633;
        border-top-color: #7c6fff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      #root:not(:empty) ~ #app-loading {
        display: none;
      }

      @media (prefers-reduced-motion: reduce) {
        #app-loading .spinner {
          animation: none;
        }
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>

    <div id="root"></div>
