    <script>
      (function() {
        try {
          var t = localStorage.getItem("clypra_theme");
          if (t === "light" || (!t && window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches)) {
            document.documentElement.classList.add("light-theme");
          }
        } catch(e) {}
      })();
    </script>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background-color: #0e0e12;
        color: #f4f4f5;
      }

      html.light-theme,
      html.light-theme body {
        background-color: #fbf9f6;
        color: #1c1917;
      }

      #app-loading {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #120d1a;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.055'/%3E%3C/svg%3E");
        color: #f4f4f5;
        z-index: 9999;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }

      html.light-theme #app-loading {
        background-color: #fbf9f6;
        color: #1c1917;
      }

      #app-loading .loading-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }

      #app-loading .logo-wrapper {
        position: relative;
        width: 64px;
        height: 64px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #app-loading .spinner-ring {
        position: absolute;
        inset: 0;
        border: 2px dashed #f59e0b;
        opacity: 0.6;
        border-radius: 50%;
        animation: spin 1.4s linear infinite;
      }

      #app-loading .loading-logo {
        width: 32px;
        height: 32px;
        user-select: none;
      }

      #app-loading .loading-text {
        font-size: 11px;
        font-family: ui-monospace, SFMono-Regular, monospace;
        letter-spacing: 0.05em;
        opacity: 0.6;
      }

      #root:not(:empty) ~ #app-loading {
        display: none;
      }

      @media (prefers-reduced-motion: reduce) {
        #app-loading .spinner-ring {
          animation: none;
        }
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="app-loading" aria-label="Loading Clypra Studio">
      <div class="loading-content">
        <div class="logo-wrapper">
          <div class="spinner-ring"></div>
          <img src="/clypra.svg" alt="Clypra" class="loading-logo" />
        </div>
        <span class="loading-text">Loading Clypra Studio…</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
